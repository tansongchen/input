<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 一条雪花臂（朝上），以原点为中心 -->
    <g id="arm" stroke="#F8F7EE" stroke-width="20" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
      <line x1="0" y1="-36" x2="0" y2="-194"/>
      <polyline points="-50,-170 0,-120 50,-170" stroke-width="18"/>
    </g>
    <!-- 两臂之间的浅蓝菱形 -->
    <polygon id="kite" points="0,-60 25,-104 0,-150 -25,-104" fill="#A9D3F2"/>
    <!-- 两臂之间的白色圆点 -->
    <circle id="dot" cx="0" cy="-168" r="12" fill="#F8F7EE"/>
  </defs>

  <!-- 背景（圆角 64） -->
  <rect width="512" height="512" rx="64" ry="64" fill="#7EA6C9"/>

  <!-- 外圈白环 + 深蓝圆盘 -->
  <circle cx="256" cy="256" r="224" fill="#F8F7EE"/>
  <circle cx="256" cy="256" r="205" fill="#2E6A9E"/>

  <g transform="translate(256 256)">
    <!-- 菱形与圆点：位于两臂之间（30° 偏移），严格每 60° 重复 -->
    <g transform="rotate(30)">
      <use xlink:href="#kite"/>
      <use xlink:href="#kite" transform="rotate(60)"/>
      <use xlink:href="#kite" transform="rotate(120)"/>
      <use xlink:href="#kite" transform="rotate(180)"/>
      <use xlink:href="#kite" transform="rotate(240)"/>
      <use xlink:href="#kite" transform="rotate(300)"/>
      <use xlink:href="#dot"/>
      <use xlink:href="#dot" transform="rotate(60)"/>
      <use xlink:href="#dot" transform="rotate(120)"/>
      <use xlink:href="#dot" transform="rotate(180)"/>
      <use xlink:href="#dot" transform="rotate(240)"/>
      <use xlink:href="#dot" transform="rotate(300)"/>
    </g>

    <!-- 六条臂 -->
    <use xlink:href="#arm"/>
    <use xlink:href="#arm" transform="rotate(60)"/>
    <use xlink:href="#arm" transform="rotate(120)"/>
    <use xlink:href="#arm" transform="rotate(180)"/>
    <use xlink:href="#arm" transform="rotate(240)"/>
    <use xlink:href="#arm" transform="rotate(300)"/>

    <!-- 中心圆 -->
    <circle r="22" fill="#F8F7EE"/>
  </g>
</svg>
